/* ============ Orbit · 뽀모도로 ============ */
:root{
  --font:'Pretendard Orbit',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
  --sky1:#e7f5ff;--sky2:#d0ebff;--sky3:#a5d8ff;--sky4:#74c0fc;--sky5:#4dabf7;--sky7:#1c7ed6;--sky8:#1971c2;
  --lav1:#f3f0ff;--lav2:#e5dbff;--lav3:#d0bfff;--lav4:#b197fc;--lav5:#9775fa;--lav7:#7048e8;--lav8:#5f3dc4;
  --navy:#364fc7;

  --bg:#e6e9ff;
  --text:#28335f;--text-strong:#364fc7;--muted:#6f78a6;--faint:#a2aad0;
  --card:rgba(255,255,255,.70);--card-2:rgba(255,255,255,.55);--card-line:rgba(255,255,255,.85);
  --card-shadow:0 30px 70px -26px rgba(54,79,199,.38),0 2px 10px rgba(54,79,199,.06);
  --line:rgba(54,79,199,.11);--line-2:rgba(54,79,199,.2);
  --chip:rgba(255,255,255,.6);--chip-hover:rgba(255,255,255,.95);
  --hl-bg:#e7f5ff;--hl-fg:#1c7ed6;--hl-line:#a5d8ff;
  --pill-bg:#e5dbff;--pill-fg:#5f3dc4;
  --track:rgba(54,79,199,.09);
  --pop:rgba(255,255,255,.94);
  --danger:#e8590c;
  --ok:#0ca678;

  --ring-a:#74c0fc;--ring-b:#b197fc;--phase-fg:#1c7ed6;--phase-soft:#e7f5ff;--phase-line:#a5d8ff;
  --play-a:#74c0fc;--play-b:#9775fa;
  --heat0:rgba(54,79,199,.07);--heat1:#d0ebff;--heat2:#a5d8ff;--heat3:#74c0fc;--heat4:#4dabf7;--heat5:#1c7ed6;
  --radius:28px;
  color-scheme:light;
}
:root[data-mode="dark"]{
  --bg:#0c1131;
  --text:#e2e7ff;--text-strong:#c5d0ff;--muted:#99a3d6;--faint:#5d68a3;
  --card:rgba(17,22,56,.56);--card-2:rgba(255,255,255,.04);--card-line:rgba(165,216,255,.13);
  --card-shadow:0 34px 90px -24px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.02);
  --line:rgba(165,216,255,.11);--line-2:rgba(165,216,255,.22);
  --chip:rgba(255,255,255,.045);--chip-hover:rgba(255,255,255,.1);
  --hl-bg:rgba(77,171,247,.16);--hl-fg:#a5d8ff;--hl-line:rgba(165,216,255,.5);
  --pill-bg:rgba(151,117,250,.2);--pill-fg:#d0bfff;
  --track:rgba(165,216,255,.11);
  --pop:rgba(23,28,66,.96);
  --danger:#ffa94d;
  --ok:#63e6be;
  --ring-a:#74c0fc;--ring-b:#b197fc;--phase-fg:#a5d8ff;--phase-soft:rgba(77,171,247,.15);--phase-line:rgba(165,216,255,.4);
  --heat0:rgba(255,255,255,.055);--heat1:#1b3b6b;--heat2:#1864ab;--heat3:#339af0;--heat4:#74c0fc;--heat5:#b5dcff;
  color-scheme:dark;
}
body[data-phase="break"]{--ring-a:#d0bfff;--ring-b:#faa2c1;--phase-fg:#7048e8;--phase-soft:#f3f0ff;--phase-line:#d0bfff;--play-a:#b197fc;--play-b:#f783ac}
body[data-phase="break"][data-long="1"]{--ring-a:#96f2d7;--ring-b:#74c0fc;--phase-fg:#0c8599;--phase-soft:#e3fafc;--phase-line:#99e9f2;--play-a:#63e6be;--play-b:#4dabf7}
:root[data-mode="dark"] body[data-phase="break"]{--phase-fg:#d0bfff;--phase-soft:rgba(151,117,250,.18);--phase-line:rgba(208,191,255,.45)}
:root[data-mode="dark"] body[data-phase="break"][data-long="1"]{--phase-fg:#96f2d7;--phase-soft:rgba(99,230,190,.14);--phase-line:rgba(150,242,215,.45)}

*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);background-color:#171c4c}
:root[data-mode="light"]{background-color:#ddeeff}
body{
  font-family:var(--font);color:var(--text);background:transparent;
  font-feature-settings:"ss06" 1,"cv11" 1;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  letter-spacing:-.005em;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sky4);outline-offset:2px;border-radius:10px}
svg{display:block}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

#sky{position:fixed;top:0;left:0;width:100%;height:100%;height:max(100%,100lvh);z-index:0;pointer-events:none}

.app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;align-items:center;padding:calc(var(--sat) + 12px) max(16px,env(safe-area-inset-right)) calc(var(--sab) + 14px) max(16px,env(safe-area-inset-left))}

/* ---------- top bar ---------- */
.top{width:100%;max-width:1128px;display:flex;align-items:center;gap:10px;padding:2px 2px 10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:750;font-size:16px;letter-spacing:-.01em;color:var(--text-strong);user-select:none}
.brand svg{width:26px;height:26px;filter:drop-shadow(0 3px 8px rgba(54,79,199,.25))}
.top .spacer{flex:1}
.dday{display:inline-flex;align-items:baseline;gap:6px;background:var(--pill-bg);color:var(--pill-fg);font-weight:700;font-size:12.5px;padding:6px 12px;border-radius:999px;white-space:nowrap;transition:transform .2s}
.dday b{font-size:13.5px;font-weight:800;letter-spacing:.01em}
.dday:hover{transform:translateY(-1px)}
.icon-btn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--muted);background:var(--chip);border:1px solid var(--line);transition:background .2s,color .2s,transform .15s}
.icon-btn:hover{background:var(--chip-hover);color:var(--text-strong)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.on{color:var(--hl-fg);background:var(--hl-bg);border-color:var(--hl-line)}

/* today strip */
.today{width:100%;max-width:1128px;display:flex;align-items:center;gap:12px;padding:0 4px 14px;font-size:12.5px;color:var(--muted)}
.today>.lbl b{color:var(--text-strong);font-weight:750;font-size:13.5px}
.today>.bar{flex:1;height:6px;border-radius:99px;background:var(--track);overflow:hidden;position:relative}
.today>.bar i{position:absolute;inset:0 auto 0 0;width:0;border-radius:99px;background:linear-gradient(90deg,var(--sky4),var(--lav4));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.today>.bar.full i{background:linear-gradient(90deg,var(--sky4),var(--lav4),#faa2c1)}
.today>.stars{display:inline-flex;align-items:center;gap:4px;color:var(--text-strong);font-weight:700;white-space:nowrap}
.today>.stars svg{width:13px;height:13px;color:var(--lav5)}
.today>.pct{min-width:34px;text-align:right;font-weight:650;color:var(--text-strong)}

/* ---------- layout ---------- */
.layout{width:100%;max-width:1128px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px;justify-items:center;flex:1}
.card{
  background:var(--card);border:1px solid var(--card-line);border-radius:var(--radius);
  box-shadow:var(--card-shadow);
  -webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);
}
.timer-card{width:100%;max-width:470px;perspective:1400px;position:relative;align-self:center}
.stats-card{width:100%;max-width:470px;display:none;padding:22px 20px 24px}
body.view-stats .timer-card{display:none}
body.view-stats .stats-card{display:block}
@media (min-width:940px){
  .app{height:100vh;height:100dvh;min-height:0}
  .layout{grid-template-columns:470px minmax(0,640px);grid-template-rows:minmax(0,1fr);justify-content:center;align-items:stretch;min-height:0}
  .timer-card{align-self:stretch;display:flex;flex-direction:column;justify-content:center;min-height:0}
  .stats-card{display:block;max-width:none;height:100%;min-height:0;overflow:auto;overscroll-behavior:contain}
  body.view-stats .timer-card{display:flex}
  #statsBtn{display:none}
}
.stats-card::-webkit-scrollbar{width:8px}
.stats-card::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px}

/* ---------- timer card ---------- */
.face{padding:20px 22px 18px;display:flex;flex-direction:column;align-items:center;transform-style:preserve-3d;backface-visibility:hidden}
.face.flip-out{animation:flipOut .26s cubic-bezier(.5,0,.75,0) forwards}
.face.flip-in{animation:flipIn .5s cubic-bezier(.2,.9,.25,1.15)}
@keyframes flipOut{to{transform:rotateY(90deg) scale(.97);opacity:.6}}
@keyframes flipIn{from{transform:rotateY(-90deg) scale(.97);opacity:.6}to{transform:none;opacity:1}}

.phase{display:inline-flex;align-items:center;gap:8px;padding:5px 13px 5px 11px;border-radius:999px;background:var(--phase-soft);color:var(--phase-fg);border:1px solid var(--phase-line);font-size:12px;font-weight:700;transition:background .4s,color .4s,border-color .4s}
.phase .en{letter-spacing:.2em;font-size:11px;font-weight:800}
.phase .dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor}
body.running .phase .dot{animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 55%,transparent)}100%{box-shadow:0 0 0 8px transparent}}

.ring-wrap{position:relative;width:var(--ring);height:var(--ring);margin:12px 0 6px;--ring:max(176px,min(330px,72vw,calc(100vh - 404px - var(--sat) - var(--sab))));--ring:max(176px,min(330px,72vw,calc(100dvh - 404px - var(--sat) - var(--sab))))}
.ring-wrap svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--track);stroke-width:9}
.ring-orbit{fill:none;stroke:var(--line-2);stroke-width:1;stroke-dasharray:1.5 7;opacity:.9}
.ring-prog{fill:none;stroke:url(#ringGrad);stroke-width:9;stroke-linecap:round;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--ring-a) 70%,transparent))}
.ring-planet{transition:opacity .3s}
:root:not([data-mode="dark"]) .ring-planet circle:last-child{filter:drop-shadow(0 0 3px rgba(77,171,247,.95)) drop-shadow(0 0 8px rgba(151,117,250,.6))}
#gA{stop-color:var(--ring-a);transition:stop-color .6s}
#gB{stop-color:var(--ring-b);transition:stop-color .6s}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding-top:calc(var(--ring) * .08);pointer-events:none}
.ring-center>*{pointer-events:auto}
.time{font-size:calc(var(--ring) * .285);font-weight:220;letter-spacing:-.035em;color:var(--text-strong);line-height:1;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;transition:opacity .3s}
:root[data-mode="dark"] .time{font-weight:260;color:#eef1ff;text-shadow:0 0 30px rgba(165,216,255,.25)}
.time.long{font-size:calc(var(--ring) * .215)}
body.paused .time{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.sub-line{font-size:12.5px;color:var(--muted);font-weight:550;display:flex;align-items:center;gap:6px;min-height:18px}
.ring-hint{max-width:calc(var(--ring) * .7);font-size:11.5px;line-height:1.45;color:var(--muted);text-align:center;font-weight:550;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:17px}
.ring-hint b{color:var(--text-strong);font-weight:700}
.next-pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:650;color:var(--muted);padding:4px 8px 4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card-2);transition:all .2s}
.next-pill:hover{color:var(--text-strong);border-color:var(--line-2);background:var(--chip-hover)}
.next-pill svg{width:12px;height:12px;opacity:.7}
.next-pill.over{color:var(--hl-fg);background:var(--hl-bg);border-color:var(--hl-line)}

.dots{display:flex;gap:7px;height:10px;margin:2px 0 6px;align-items:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--track);border:1px solid var(--line-2);transition:all .3s}
.dots i.on{background:linear-gradient(135deg,var(--sky4),var(--lav4));border-color:transparent;box-shadow:0 0 8px rgba(116,192,252,.6)}
.dots i.now{border-color:var(--sky4);animation:pulse 2s infinite;color:var(--sky4)}
.dots .dl{font-size:10.5px;color:var(--faint);margin-left:4px;font-weight:600}

.subject{display:inline-flex;align-items:center;gap:7px;padding:7px 12px 7px 11px;border-radius:999px;background:var(--chip);border:1px solid var(--line);font-size:13px;font-weight:650;color:var(--text);transition:all .2s;margin-top:4px}
.subject:hover{background:var(--chip-hover);border-color:var(--line-2)}
.subject .sd{width:9px;height:9px;border-radius:50%}
.subject svg{width:13px;height:13px;color:var(--muted)}
.subject .sl{color:var(--muted);font-weight:550;font-size:12px}

.controls{display:flex;align-items:center;gap:18px;margin:14px 0 16px}
.ctrl{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--chip);border:1px solid var(--line);transition:all .2s}
.ctrl:hover{color:var(--text-strong);background:var(--chip-hover);transform:translateY(-1px)}
.ctrl:active{transform:scale(.93)}
.ctrl svg{width:19px;height:19px}
.ctrl[disabled]{opacity:.35;pointer-events:none}
.ctrl.play{width:72px;height:72px;color:#fff;border:0;background:linear-gradient(135deg,var(--play-a),var(--play-b));box-shadow:0 14px 30px -10px color-mix(in srgb,var(--play-b) 75%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.ctrl.play svg{width:26px;height:26px}
.ctrl.play:hover{color:#fff;filter:brightness(1.05) saturate(1.05);transform:translateY(-2px)}

.presets{width:100%;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}
.chip{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 2px 8px;border-radius:16px;background:var(--chip);border:1px solid var(--line);transition:all .18s}
.chip:hover{background:var(--chip-hover);border-color:var(--line-2);transform:translateY(-1px)}
.chip:active{transform:scale(.96)}
.chip .v{font-size:19px;font-weight:750;color:var(--text-strong);line-height:1.1;letter-spacing:-.02em}
.chip .v small{font-size:11px;font-weight:650;margin-left:1px;letter-spacing:0}
.chip .b{font-size:10.5px;color:var(--muted);font-weight:550;white-space:nowrap}
.chip.on{background:var(--hl-bg);border-color:var(--hl-line);box-shadow:0 0 0 3px color-mix(in srgb,var(--hl-line) 35%,transparent)}
.chip.on .v{color:var(--hl-fg)}
.chip.on .b{color:var(--hl-fg);opacity:.85}
.chip.live::after{content:"";position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--ring-a);box-shadow:0 0 6px var(--ring-a)}
.chip.plus .v svg{width:19px;height:19px;margin:1px 0}
.chip.plus .b{font-size:10px}

.hint{display:none}
.hint b{color:var(--text-strong);font-weight:700}
.foot{display:none}
.foot kbd{font-family:inherit;font-size:10.5px;padding:1px 5px;border-radius:5px;border:1px solid var(--line-2);color:var(--muted);background:var(--card-2)}
.audio-hint{display:none;margin-top:8px;font-size:11.5px;color:var(--danger);font-weight:600}
body.need-audio .audio-hint{display:block}

/* ---------- stats ---------- */
.sec{display:table;margin:0 auto 12px;background:var(--pill-bg);color:var(--pill-fg);font-weight:750;font-size:12px;padding:5px 13px;border-radius:999px;letter-spacing:.01em}
.sec .en{opacity:.7;font-weight:700;margin-left:5px;font-size:10.5px;letter-spacing:.12em}
.block{margin-bottom:26px}
.block:last-child{margin-bottom:0}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{background:var(--card-2);border:1px solid var(--line);border-radius:18px;padding:12px 8px 11px;text-align:center}
.tile .k{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap}
.tile .val{margin-top:4px;font-size:21px;font-weight:780;color:var(--text-strong);letter-spacing:-.02em;line-height:1.15;white-space:nowrap}
.tile .val small{font-size:12px;font-weight:650;margin-left:1px;color:var(--muted)}
.tile.hl{background:var(--hl-bg);border-color:var(--hl-line)}
.tile.hl .val{color:var(--hl-fg)}
.goal-line{margin-top:12px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.goal-line .bar{flex:1;height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.goal-line .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--sky4),var(--lav4))}
.goal-line b{color:var(--text-strong)}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:150px;position:relative;padding-top:18px}
.week .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.week .bar{width:100%;max-width:34px;border-radius:10px 10px 6px 6px;background:linear-gradient(180deg,var(--sky3),var(--sky4));min-height:3px;position:relative;transition:height .5s cubic-bezier(.2,.8,.2,1)}
:root[data-mode="dark"] .week .bar{background:linear-gradient(180deg,#74c0fc,#4c6ef5)}
.week .bar.met{background:linear-gradient(180deg,var(--lav3),var(--sky4))}
:root .week .bar.zero{background:var(--track)}
.week .bar span{position:absolute;bottom:calc(100% + 3px);left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.week .d{font-size:11px;line-height:14px;color:var(--muted);font-weight:600}
.week .col.is-today .d{color:var(--hl-fg);font-weight:800}
.week .goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--lav4);opacity:.7;pointer-events:none}
.week-cap{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:10px;font-size:11px;color:var(--muted);font-weight:600}
.week-cap i{width:18px;border-top:1.5px dashed var(--lav4)}

.seg{display:flex;justify-content:center;gap:4px;margin:-4px 0 12px}
.seg button{font-size:11.5px;font-weight:650;color:var(--muted);padding:4px 10px;border-radius:999px;border:1px solid transparent}
.seg button.on{color:var(--hl-fg);background:var(--hl-bg);border-color:var(--hl-line)}
.subj-rows{display:flex;flex-direction:column;gap:9px}
.srow{display:grid;grid-template-columns:62px 1fr 64px;align-items:center;gap:10px;font-size:12.5px}
.srow .n{display:flex;align-items:center;gap:6px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .n i{width:8px;height:8px;border-radius:50%;flex:none}
.srow .t{height:10px;border-radius:99px;background:var(--track);overflow:hidden}
.srow .t i{display:block;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.srow .m{text-align:right;color:var(--muted);font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{font-size:12.5px;color:var(--faint);text-align:center;padding:10px 0}

.heat-wrap{overflow-x:auto;padding-bottom:4px}
.heat{--cs:13px;--cg:3.5px;display:grid;grid-auto-flow:column;grid-template-rows:16px repeat(7,var(--cs));gap:var(--cg);justify-content:center;min-width:max-content}
.heat .c{width:var(--cs);height:var(--cs);border-radius:calc(var(--cs) * .3);background:var(--heat0)}
.heat .c.l1{background:var(--heat1)}.heat .c.l2{background:var(--heat2)}.heat .c.l3{background:var(--heat3)}.heat .c.l4{background:var(--heat4)}
.heat .c.l5{background:var(--heat5);box-shadow:0 0 6px color-mix(in srgb,var(--heat5) 60%,transparent)}
.heat .c.t{outline:1.5px solid var(--lav5);outline-offset:1px}
.heat .c.f{background:transparent}
.heat .c.dd{background:transparent;outline:1.5px dashed var(--lav4);outline-offset:-1px}
.heat .ml{width:var(--cs);overflow:visible;font-size:10.5px;color:var(--muted);font-weight:650;white-space:nowrap;height:14px;line-height:12px}
.heat .wl{font-size:10px;color:var(--faint);font-weight:600;line-height:var(--cs);width:16px}
.heat-legend{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11px;color:var(--muted)}
.heat-legend .lg{display:flex;align-items:center;gap:3px}
.heat-legend .lg .c{width:11px;height:11px;border-radius:3px}
.heat-sum{font-weight:600}
.heat-sum b{color:var(--text-strong)}

.log{display:flex;flex-direction:column;gap:6px}
.lrow{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:var(--card-2);border:1px solid var(--line);font-size:12.5px}
.lrow .tm{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.lrow .sb{display:inline-flex;align-items:center;gap:6px;font-weight:650;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lrow .sb i{width:8px;height:8px;border-radius:50%;flex:none}
.lrow .du{font-weight:700;color:var(--text-strong);font-variant-numeric:tabular-nums;white-space:nowrap}
.lrow .du.part{color:var(--muted);font-weight:600}
.lrow .du svg{display:inline;width:11px;height:11px;vertical-align:-1px;margin-right:3px;color:var(--lav5)}
.lrow .x{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;color:var(--faint);opacity:.0;transition:opacity .2s,background .2s}
.lrow:hover .x,.lrow .x:focus-visible{opacity:1}
.lrow .x:hover{background:var(--chip-hover);color:var(--danger)}
.lrow .x svg{width:13px;height:13px}
@media (hover:none){.lrow .x{opacity:.7}}
.more{display:block;margin:8px auto 0;font-size:12px;color:var(--muted);font-weight:650;padding:4px 10px;border-radius:999px}
.more:hover{color:var(--text-strong);background:var(--chip-hover)}

/* ---------- popover ---------- */
.pop{position:fixed;z-index:50;min-width:240px;max-width:min(380px,calc(100vw - 24px));background:var(--pop);border:1px solid var(--line-2);border-radius:20px;padding:14px;box-shadow:0 24px 60px -16px rgba(20,28,80,.45);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);opacity:0;transform:translateY(-4px) scale(.98);pointer-events:none;transition:opacity .16s,transform .16s}
.pop.open{opacity:1;transform:none;pointer-events:auto}
.pop h4{font-size:12.5px;font-weight:750;color:var(--text-strong);margin-bottom:10px;text-align:center}
.pop p{font-size:12.5px;line-height:1.55;color:var(--text);text-align:center}
.pop .note{font-size:11px;color:var(--muted);margin-top:10px;text-align:center;line-height:1.5}
.opts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.opt{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--chip);font-size:12.5px;font-weight:650;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.opt:hover{background:var(--chip-hover);border-color:var(--line-2)}
.opt.on{background:var(--hl-bg);color:var(--hl-fg);border-color:var(--hl-line)}
.opt i{width:8px;height:8px;border-radius:50%}
.opt.def::after{content:"기본";font-size:9.5px;font-weight:700;color:var(--lav5);margin-left:2px}
.btns{display:flex;gap:8px;justify-content:center;margin-top:14px}
.btn{padding:9px 16px;border-radius:999px;font-size:13px;font-weight:700;border:1px solid var(--line-2);background:var(--chip);transition:all .15s}
.btn:hover{background:var(--chip-hover)}
.btn.pri{color:#fff;border:0;background:linear-gradient(135deg,var(--sky5),var(--lav5));box-shadow:0 8px 18px -8px rgba(112,72,232,.6)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.warn{color:var(--danger)}
.stepper{display:flex;align-items:center;justify-content:center;gap:10px;margin:2px 0 10px}
.stepper button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line-2);background:var(--chip);font-size:18px;font-weight:600;display:grid;place-items:center}
.stepper button:hover{background:var(--chip-hover)}
.stepper .sv{min-width:92px;text-align:center;font-size:26px;font-weight:300;color:var(--text-strong);font-variant-numeric:tabular-nums}
.stepper .sv small{font-size:13px;font-weight:600;margin-left:2px;color:var(--muted)}
.stepper input{width:64px;text-align:center;font-size:24px;font-weight:350;color:var(--text-strong);border:0;border-bottom:1.5px solid var(--line-2);background:transparent;padding:2px 0}
.stepper input:focus{outline:none;border-color:var(--sky4)}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input[type=number]{-moz-appearance:textfield}
.lab{font-size:11px;font-weight:700;color:var(--muted);text-align:center;margin:12px 0 7px;letter-spacing:.02em}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,14,40,.28);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:45;top:calc(var(--sat) + 8px);right:10px;bottom:calc(var(--sab) + 8px);width:min(420px,calc(100vw - 20px));display:flex;flex-direction:column;background:var(--pop);border:1px solid var(--line-2);border-radius:26px;box-shadow:0 30px 80px -20px rgba(10,14,40,.5);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);transform:translateX(calc(100% + 30px));transition:transform .35s cubic-bezier(.2,.85,.25,1)}
.drawer.open{transform:none}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 10px 22px}
.drawer header h3{font-size:16px;font-weight:780;color:var(--text-strong)}
.drawer .body{overflow:auto;padding:4px 18px 24px}
.drawer .body::-webkit-scrollbar{width:8px}
.drawer .body::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px}
.set{background:var(--card-2);border:1px solid var(--line);border-radius:20px;padding:16px 14px;margin-bottom:12px}
.set .sec{margin-bottom:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 2px;font-size:13px}
.row+.row{border-top:1px solid var(--line)}
.row .rl{font-weight:600;line-height:1.4}
.row .rl small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;margin-top:1px}
.pair{display:grid;grid-template-columns:46px 1fr;align-items:center;gap:8px;padding:5px 0}
.pair .mini{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.pair .mini button{padding:6px 0;text-align:center;white-space:nowrap;font-size:11px}
.pair .pk{font-weight:750;color:var(--text-strong);font-size:13px;text-align:right;padding-right:4px}
.mini{display:flex;gap:4px;flex-wrap:wrap}
.mini button{padding:5px 8px;border-radius:10px;border:1px solid var(--line);background:var(--chip);font-size:11.5px;font-weight:650;color:var(--muted);transition:all .15s;font-variant-numeric:tabular-nums}
.mini button:hover{border-color:var(--line-2);color:var(--text)}
.mini button.on{background:var(--hl-bg);border-color:var(--hl-line);color:var(--hl-fg)}
.toggle{position:relative;width:42px;height:25px;flex:none;border-radius:99px;background:var(--track);border:1px solid var(--line-2);transition:background .2s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(20,30,80,.25);transition:transform .22s cubic-bezier(.3,.9,.3,1.2)}
.toggle.on{background:linear-gradient(135deg,var(--sky4),var(--lav4));border-color:transparent}
.toggle.on::after{transform:translateX(17px)}
.sm-step{display:flex;align-items:center;gap:6px}
.sm-step button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line-2);background:var(--chip);font-weight:700;display:grid;place-items:center;font-size:14px}
.sm-step span{min-width:54px;text-align:center;font-weight:700;color:var(--text-strong);font-variant-numeric:tabular-nums;font-size:13px}
.field{border:1px solid var(--line-2);background:var(--chip);border-radius:10px;padding:6px 9px;font-size:13px;width:140px}
.field:focus{outline:none;border-color:var(--sky4);box-shadow:0 0 0 3px color-mix(in srgb,var(--sky3) 40%,transparent)}
input[type=range]{width:150px;accent-color:var(--sky5)}
.subj-edit{display:flex;flex-direction:column;gap:6px}
.se{display:grid;grid-template-columns:22px 1fr auto auto;gap:8px;align-items:center}
.se .cdot{width:18px;height:18px;border-radius:50%;border:2px solid var(--card-line);box-shadow:0 0 0 1px var(--line-2)}
.se input{width:100%}
.se .ib{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--faint)}
.se .ib:hover{background:var(--chip-hover);color:var(--text)}
.se .ib.del:hover{color:var(--danger)}
.se .ib svg{width:14px;height:14px}
.add-sub{margin-top:8px;display:flex;gap:6px}
.add-sub input{flex:1;width:auto}
.keys{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;font-size:12.5px;align-items:center}
.keys kbd{font-family:inherit;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;border:1px solid var(--line-2);background:var(--chip);color:var(--text-strong);justify-self:start}
.about{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.6;padding:6px 10px 0}

/* ---------- toast / tooltip ---------- */
.toast{position:fixed;z-index:60;left:50%;bottom:calc(var(--sab) + 20px);transform:translate(-50%,20px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);padding:11px 12px 11px 18px;border-radius:999px;background:var(--pop);border:1px solid var(--line-2);box-shadow:0 18px 50px -14px rgba(20,28,80,.45);font-size:13px;font-weight:600;transition:all .28s cubic-bezier(.2,.9,.3,1.2);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.toast.open{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{font-size:12.5px;font-weight:750;color:var(--hl-fg);background:var(--hl-bg);border:1px solid var(--hl-line);padding:5px 12px;border-radius:999px;white-space:nowrap}
.toast .tx{line-height:1.4}
.tip{position:fixed;z-index:70;pointer-events:none;padding:6px 10px;border-radius:10px;background:var(--pop);border:1px solid var(--line-2);font-size:11.5px;font-weight:600;box-shadow:0 10px 30px -10px rgba(20,28,80,.4);opacity:0;transition:opacity .12s;white-space:nowrap}
.tip.open{opacity:1}

/* ---------- mini (PiP) ---------- */
body.pip{background:transparent;overflow:hidden}
.pipw{position:fixed;inset:0;display:flex;align-items:center;gap:14px;padding:12px 16px;background:linear-gradient(135deg,#dfe7ff,#efe6ff 60%,#e6f3ff)}
:root[data-mode="dark"] .pipw{background:radial-gradient(120% 140% at 10% 0%,#1d2660 0%,#0d1236 55%,#080b24 100%)}
.pipw .pr{position:relative;width:min(78px,52vh);height:min(78px,52vh);flex:none}
.pipw .pr svg{width:100%;height:100%;overflow:visible}
.pipw .pr .ring-track{stroke-width:10}
.pipw .pr .ring-prog{stroke-width:10}
.pipw .pm{flex:1;min-width:0}
.pipw .pt{font-size:min(40px,26vh,15vw);font-weight:300;color:var(--text-strong);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
:root[data-mode="dark"] .pipw .pt{color:#eef1ff}
.pipw .pl{margin-top:6px;font-size:11.5px;color:var(--muted);font-weight:650;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.pipw .pl b{color:var(--phase-fg);letter-spacing:.16em;font-size:10.5px}
.pipw .pl i{width:7px;height:7px;border-radius:50%;flex:none}
.pipw .pb{display:flex;flex-direction:column;gap:6px}
.pipw .pb button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--chip);border:1px solid var(--line-2);color:var(--muted)}
.pipw .pb button.pp{color:#fff;border:0;background:linear-gradient(135deg,var(--play-a),var(--play-b))}
.pipw .pb svg{width:15px;height:15px}
body.paused .pipw .pt{animation:blink 1.6s ease-in-out infinite}

/* ---------- small screens ---------- */
@media (max-width:420px){
  .app{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
  .face{padding:18px 14px 14px}
  .presets{gap:5px}
  .chip .v{font-size:17px}
  .chip .b{font-size:9.5px}
  .controls{gap:14px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand span{display:none}
}
@media (max-height:700px){
  .ring-wrap{margin:10px 0 4px}
  .controls{margin:10px 0 12px}
  .ctrl.play{width:64px;height:64px}
  .face{padding-top:16px;padding-bottom:16px}
  .today{padding-bottom:12px}
  .top{padding-bottom:8px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
body.no-motion .face.flip-out,body.no-motion .face.flip-in{animation:none}

/* ---------- 알림 설정 ---------- */
.help{margin:8px 2px 4px;padding:10px 12px;border-radius:14px;background:var(--hl-bg);border:1px solid var(--hl-line);font-size:11.5px;line-height:1.65;color:var(--text)}
.help b{color:var(--hl-fg)}
.topic{display:flex;align-items:center;gap:8px;margin:10px 0 8px;padding:10px 10px 10px 12px;border-radius:14px;background:var(--chip);border:1px dashed var(--line-2);flex-wrap:wrap}
.topic .tl{font-size:11px;font-weight:700;color:var(--muted);width:100%}
.topic code{flex:1;min-width:0;font-family:ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:15px;font-weight:600;color:var(--text-strong);letter-spacing:.02em;user-select:all;word-break:break-all}
.steps{margin:4px 0 8px 18px;font-size:12.5px;line-height:1.7}
.steps li{padding-left:2px}
.steps .muted{color:var(--muted);font-size:11.5px}
.pstat{font-size:11.5px;color:var(--muted);text-align:center;margin:2px 0 8px;min-height:16px}
.pstat.ok{color:var(--ok)}
.pstat.err{color:var(--danger)}
.btn[disabled]{opacity:.6;pointer-events:none}
body.pip.flash .pipw{animation:pipflash 1s ease-in-out 6}

@media (max-width:359px){#bellBtn{display:none}}
.row .btn{flex:none;white-space:nowrap}

/* ---------- ROAD TO ---------- */
.sec.road{display:flex;width:max-content;margin:0 auto 14px;align-items:center;gap:7px;padding:5px 6px 5px 14px}
.sec.road .rt{font-size:10.5px;letter-spacing:.16em;font-weight:800;opacity:.75}
.sec.road .dd{background:var(--card-2);border:1px solid color-mix(in srgb,var(--pill-fg) 30%,transparent);border-radius:999px;padding:1px 8px;font-size:11px;font-weight:800;letter-spacing:.02em}
.heat-sum .dot{opacity:.4;margin:0 5px}

/* ---------- sync / onboarding ---------- */
.linkbtn{color:var(--hl-fg);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:0 2px}
.tokrow{display:flex;gap:6px;margin:4px 0 2px}
.tokrow .field{flex:1;width:auto;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
#syncStatus.err{color:var(--danger)}
.onb{position:relative;margin:0 0 18px;padding:12px 34px 12px 14px;border-radius:16px;background:var(--hl-bg);border:1px solid var(--hl-line);font-size:12px;line-height:1.75}
.onb b{color:var(--hl-fg)}
.onb>b{display:block;margin-bottom:2px}
.onb-x{position:absolute;top:6px;right:8px;width:24px;height:24px;border-radius:8px;font-size:16px;color:var(--muted)}
.onb-x:hover{background:var(--chip-hover)}
button,.chip,.ctrl{touch-action:manipulation}

/* ---------- 태블릿 세로: 위 타이머 · 아래 기록 (기록만 스크롤) ---------- */
@media (min-width:700px) and (max-width:939px) and (min-height:960px){
  .app{height:100vh;height:100dvh;min-height:0}
  .layout{max-width:720px;grid-template-rows:auto minmax(0,1fr);justify-items:stretch;align-items:stretch;gap:16px;min-height:0}
  .timer-card{max-width:none;align-self:start}
  .stats-card,body.view-stats .stats-card{display:block;max-width:none;min-height:0;height:100%;overflow:auto;overscroll-behavior:contain}
  body.view-stats .timer-card{display:block}
  #statsBtn{display:none}
  .ring-wrap{--ring:min(340px,calc(100dvh * .29))}
  .face{padding:18px 26px 18px}
  .presets{max-width:520px}
}

/* ---------- 휴대폰 세로: 한 화면 고정 · 카드가 화면을 채움 · 링 크게 ---------- */
@media (max-width:699px){
  .app{height:100vh;height:100dvh;min-height:0;padding-top:calc(var(--sat) + 8px);padding-bottom:calc(var(--sab) + 10px)}
  .top{padding-bottom:8px}
  .today{padding-bottom:10px}
  .layout{flex:1;min-height:0;grid-template-rows:minmax(0,1fr);align-items:stretch}
  .timer-card{align-self:stretch;display:flex;flex-direction:column;justify-content:center;min-height:0}
  body.view-stats .stats-card{height:100%;min-height:0;overflow:auto;overscroll-behavior:contain}
  .face{padding:14px 14px 14px}
  .ring-wrap{margin:8px 0 4px;--ring:max(170px,min(360px,84vw,calc(100vh - 372px - var(--sat) - var(--sab))));--ring:max(170px,min(360px,84vw,calc(100dvh - 372px - var(--sat) - var(--sab))))}
  .controls{margin:10px 0 14px}
}

/* ---------- settings / sessions / state ---------- */
function loadSettings() {
  const s = Object.assign(clone(DEFAULTS), LS.get('settings', {}));
  s.pair = Object.assign({ ...DEFAULT_PAIR }, s.pair || {});
  s.custom = Object.assign({ ...DEFAULTS.custom }, s.custom || {});
  s.push = Object.assign(clone(DEFAULTS.push), s.push || {});
  if (!Array.isArray(s.subjects) || !s.subjects.length) s.subjects = clone(DEFAULT_SUBJECTS);
  return s;
}
let settings = loadSettings();
const LOCAL_KEYS = ['notify', 'notifySticky', 'motion', 'vol', 'theme', 'lastPreset', 'keepAwake', 'su'];
function sharedSettings() { const o = {}; for (const k of Object.keys(settings)) if (!LOCAL_KEYS.includes(k)) o[k] = settings[k]; return o; }
let lastShared = JSON.stringify(sharedSettings());
const saveSettings = () => {
  const cur = JSON.stringify(sharedSettings());
  if (cur !== lastShared) { lastShared = cur; if (!applyingRemote) { settings.su = Date.now(); scheduleSync(); } }
  LS.set('settings', settings);
};

const validRec = r => r && Number.isFinite(r.s) && Number.isFinite(r.a) && r.a >= 0 && Number.isFinite(r.id);
let sessions = LS.get('sessions', []);
sessions = Array.isArray(sessions) ? sessions.filter(validRec) : [];
let tomb = LS.get('deleted', {}); if (!tomb || typeof tomb !== 'object') tomb = {};
const saveSessions = () => { LS.set('sessions', sessions); LS.set('deleted', tomb); invalidate(); if (!applyingRemote) scheduleSync(); };
function forget(recs) { const t = Date.now(); for (const r of recs) if (r) tomb[r.id] = t; }
function revive(recs) { const t = Date.now(); for (const r of recs) if (r) { delete tomb[r.id]; r.u = t; } }

/* ---------- time helpers ---------- */
function dayKey(ts) {
  const d = new Date(ts - settings.dayStart * 3600e3);
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
const todayKey = () => dayKey(now());
function keyToDate(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(k, n) { const d = keyToDate(k); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function fmtClock(sec) {
  sec = Math.max(0, Math.ceil(sec - 1e-6));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}
function fmtDur(sec) {
  sec = Math.round(sec);
  if (sec < 60) return sec + '초';
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  if (!h) return m + '분' + (s ? ` ${s}초` : '');
  return h + '시간' + (m ? ` ${m}분` : '');
}
function fmtMin(sec) { // 누적 시간 (분 단위)
  const min = Math.floor(sec / 60);
  if (min < 60) return min + '분';
  const h = Math.floor(min / 60), m = min % 60;
  return h + '시간' + (m ? ` ${m}분` : '');
}
function fmtHM(sec) { // 짧은 표기
  const min = Math.round(sec / 60);
  if (min < 60) return { a: min, u: 'm' };
  const h = Math.floor(min / 60), m = min % 60;
  return { a: h, u: 'h', b: m };
}
const hmHTML = sec => { const x = fmtHM(sec); return x.u === 'm' ? `${x.a}<small>m</small>` : `${x.a}<small>h</small>${x.b ? ` ${x.b}<small>m</small>` : ''}`; };
const hmText = sec => { const x = fmtHM(sec); return x.u === 'm' ? `${x.a}m` : `${x.a}h${x.b ? ' ' + x.b + 'm' : ''}`; };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- favicon (진행 링) ---------- */
const Fav = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'); let last = '';
  const link = $('#favicon');
  function update(force) {
    if (permPending) return;
    const tot = totalSec(), rem = remaining();
    const p = S.phase === 'idle' ? .83 : clamp(1 - rem / Math.max(1, tot), .02, 1);
    const kind = S.phase === 'break' ? (S.isLong ? 'long' : 'break') : S.phase;
    const key = kind + Math.round(p * 60) + S.running;
    if (key === last && !force) return; last = key;

    const bg = g.createLinearGradient(0, 0, 64, 64); bg.addColorStop(0, '#2a3275'); bg.addColorStop(1, '#0b0f2e');
    g.fillStyle = bg; g.beginPath(); g.roundRect(2, 2, 60, 60, 16); g.fill();

    g.strokeStyle = 'rgba(165,216,255,.22)'; g.beginPath(); g.arc(32, 32, 19, 0, Math.PI * 2); g.stroke();
    const cols = kind === 'break' ? ['#d0bfff', '#faa2c1'] : kind === 'long' ? ['#96f2d7', '#74c0fc'] : ['#a5d8ff', '#d0bfff'];
    const lg = g.createLinearGradient(10, 10, 54, 54); lg.addColorStop(0, cols[0]); lg.addColorStop(1, cols[1]);
    g.strokeStyle = lg; const a = -Math.PI / 2 + p * Math.PI * 2;

    g.fillStyle = '#fff'; g.beginPath(); g.arc(32 + 19 * Math.cos(a), 32 + 19 * Math.sin(a), 4.6, 0, Math.PI * 2); g.fill();

    else if (S.phase === 'idle') { g.beginPath(); g.moveTo(32, 23); g.quadraticCurveTo(33, 31, 41, 32); g.quadraticCurveTo(33, 33, 32, 41); g.quadraticCurveTo(31, 33, 23, 32); g.quadraticCurveTo(31, 31, 32, 23); g.fill(); }
    link.href = c.toDataURL('image/png');

})();

const pop = $('#pop');

function heatmapHTML() {
  const k = todayKey(), goal = settings.goalMin * 60 || 1;
  const wrapW = el.stats.clientWidth || 430;
  const avail = wrapW - 40 - 20;
  const maxCols = Math.max(12, Math.floor(avail / 16.5));
  const mondayOf = key => { const d = keyToDate(key), wd = (d.getDay() + 6) % 7; return addDays(key, -wd); };
  const thisMon = mondayOf(k);
  const di = ddayInfo();
  let futureWeeks = 0, ddKey = null;
  if (di && di.diff > 0 && di.diff <= 7 * 20) { ddKey = settings.ddayDate; futureWeeks = Math.round((keyToDate(mondayOf(ddKey)) - keyToDate(thisMon)) / (7 * 864e5)); }
  futureWeeks = Math.min(futureWeeks, maxCols - 6);
  // 과거: 첫 기록 주부터 (최소 6주), 화면 폭을 넘지 않게
  let firstKey = k; for (const r of sessions) { const dk = dayKey(r.s); if (dk < firstKey) firstKey = dk; }
  const histWeeks = Math.round((keyToDate(thisMon) - keyToDate(mondayOf(firstKey))) / (7 * 864e5));
  const pastWeeks = clamp(Math.max(histWeeks, 6 + Math.max(0, 6 - futureWeeks)), 0, maxCols - futureWeeks - 1);
  const start = addDays(thisMon, -7 * pastWeeks);
  let cells = '', lastMonth = -1, total = 0, studied = 0;
  const cols = pastWeeks + 1 + futureWeeks;
  cells += `<span class="ml"></span>` + ['월', '', '수', '', '금', '', '일'].map(w => `<span class="wl">${w}</span>`).join('');
  for (let c = 0; c < cols; c++) {
    const wkStart = addDays(start, 7 * c), m = keyToDate(wkStart).getMonth();
    cells += `<span class="ml">${m !== lastMonth ? (m + 1) + '월' : ''}</span>`; lastMonth = m;
    for (let r = 0; r < 7; r++) {
      const dk = addDays(wkStart, r);
      if (dk > k) {
        const isDD = dk === ddKey;
        cells += `<span class="c ${isDD ? 'dd' : 'f'}" ${isDD ? `data-tip="${esc(settings.ddayName)} D-DAY · ${dk.slice(5).replace('-', '/')}"` : ''} style="${isDD ? '' : 'box-shadow:inset 0 0 0 1px var(--line)'}"></span>`;
        continue;
      }
      const sec = dayStat(dk).sec + (dk === k ? liveFocusSec() : 0);
      total += sec; if (sec >= 60) studied++;
      const ratio = sec / goal;
      const lv = sec < 60 ? 0 : ratio < .25 ? 1 : ratio < .5 ? 2 : ratio < .75 ? 3 : ratio < 1 ? 4 : 5;
      cells += `<span class="c${lv ? ' l' + lv : ''}${dk === k ? ' t' : ''}" data-tip="${dk.slice(5).replace('-', '/')} · ${sec >= 60 ? fmtMin(sec) : '기록 없음'}"></span>`;
    }
  }
  const cg = 4, cs = clamp(Math.floor(avail / cols) - cg, 13, 24);
  return `<div class="heat-wrap"><div class="heat" style="--cs:${cs}px;--cg:${cs > 16 ? cg : 3.5}px">${cells}</div></div>
    <div class="heat-legend"><span class="heat-sum">공부한 날 <b>${studied}</b>일<span class="dot">·</span><b>${fmtMin(total)}</b></span>
    <span class="lg">적음 ${[0, 1, 2, 3, 4, 5].map(l => `<span class="c heat-c${l}" style="background:var(--heat${l})"></span>`).join('')} 목표</span></div>`;
}

/* ==========================================================
   iOS 상태표시줄 · 홈 인디케이터 여백

   ========================================================== */
function computeInsets() {
  const pr = document.createElement('div');
  pr.style.cssText = 'position:fixed;top:0;left:0;visibility:hidden;pointer-events:none;height:env(safe-area-inset-top,0px);width:env(safe-area-inset-bottom,0px)';
  document.body.append(pr);

    const sw = Math.min(screen.width, screen.height), sh = Math.max(screen.width, screen.height);
    const portrait = innerHeight >= innerWidth, fullH = portrait ? sh : sw;
    const coversScreen = innerHeight >= fullH - 1;           // 화면 맨 위(상태표시줄 밑)까지 그려지는 상태
    const phone = sw < 600, notched = phone && sh >= 812;
    if (coversScreen) {
      if (top < 12) top = phone ? (portrait ? (notched ? 54 : 20) : 0) : 24;
      if (bottom < 12) bottom = notched ? (portrait ? 24 : 16) : (phone ? 0 : 14);
      // iOS 26+ 상태표시줄 아래 흐림(scroll edge) 구간까지 비키기 — 실기기 캡처 기준 아이폰 약 100px
      if (top > 0) top += phone ? (notched ? 40 : 28) : 26;

  document.documentElement.style.setProperty('--sab', bottom + 'px');

  navigator.serviceWorker.register('sw.js').catch(() => {});
}
if (syncCfg.token) syncApi.schedule(800);
if (DEBUG) window.__sync = { mergeDocs, localDoc, get cfg() { return syncCfg; }, run: () => syncApi.run() };

if (DEBUG) {
  window.__orbit = {
    get S() { return S; }, get sessions() { return sessions; }, get settings() { return settings; },
    seed(days = 60) {
      const r = mulberry32(42), subs = settings.subjects.map(s => s.id); sessions = [];
      const today = todayKey();
      for (let i = days; i >= 0; i--) {
        const dk = addDays(today, -i), base = keyToDate(dk); base.setHours(9, 0, 0, 0);
        if (i > 0 && r() < .18) continue;
        const n = i === 0 ? 5 : 2 + Math.floor(r() * 9); let t = base.getTime();
        for (let j = 0; j < n; j++) {
          const len = [1500, 1500, 1500, 3600, 900, 300][Math.floor(r() * 6)], done = r() > .1;
          const a = done ? len : Math.floor(len * (.3 + r() * .5));
          sessions.push({ id: t, s: t, e: t + a * 1000, p: len, a, sub: subs[Math.floor(r() * Math.min(subs.length, 9))], d: done ? 1 : 0, k: String(len / 60) });
          t += (a + 300 + r() * 1200) * 1000;
        }
      }
      saveSessions(); Sky.refresh(); renderAll(); renderStats();
    },
    finishIn(sec) { if (S.running) { S.endAt = now() + sec * 1000; saveState(); } },
    setNow(fn) { fn(S); saveState(); renderAll(); },
    renderStats, renderAll, openDrawer, closeDrawer, toast, Sky, togglePip, breakPopover: () => breakPopover(el.nextPill), customPopover: () => customPopover($('.chip.plus')), subjectPopover: () => subjectPopover($('#subjectBtn'), () => {}, S.subject),
  };
}
})();
